# One command: `docker compose up --build`
# 1. `train` fits the configured model and writes it to the shared volume.
# 2. `api` starts once training succeeded and serves it on http://localhost:8000/docs
services:
  train:
    build: .
    command: ["credit-scoring", "train"]
    env_file:
      - path: .env
        required: false
    volumes:
      - models:/app/models
      - ./reports:/app/reports

  api:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - models:/app/models
    depends_on:
      train:
        condition: service_completed_successfully

volumes:
  models:
