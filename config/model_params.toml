# Hyperparameters for each model.
# [<model>.params] are the tuned values from the original grid searches.
# [<model>.grid] is the search space used by `credit-scoring tune`.

[knn.params]
n_neighbors = 5
weights = "distance"
metric = "l1"
algorithm = "ball_tree"

[knn.grid]
clf__n_neighbors = [5, 10, 15, 20]
clf__weights = ["uniform", "distance"]
clf__metric = ["l1", "l2"]

[xgboost.params]
n_estimators = 500
max_depth = 10
learning_rate = 0.1
subsample = 0.8
colsample_bytree = 0.8
reg_alpha = 0.1
reg_lambda = 1.0
tree_method = "hist"
n_jobs = -1

[xgboost.grid]
clf__n_estimators = [300, 500]
clf__max_depth = [8, 10]
clf__learning_rate = [0.05, 0.1]
clf__colsample_bytree = [0.8, 1.0]

[random_forest.params]
n_estimators = 300
max_depth = 0          # 0 => unlimited depth (TOML has no null)
min_samples_split = 2
min_samples_leaf = 1
max_features = "sqrt"
n_jobs = -1

[random_forest.grid]
clf__n_estimators = [100, 300]
clf__min_samples_leaf = [1, 2, 4]
clf__max_features = ["sqrt", "log2"]
